<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin - Usermanagement</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta charset="UTF-8">
    <script>
        function makeGetRequest() {
            const textFieldValue = document.getElementById('inputField').value;
            const url = `/api/rest/admin/v1/usermanagement/delete/${encodeURIComponent(textFieldValue)}`;

            fetch(url)
                    .then(response => {
                        if (response.ok) {
                            document.getElementById('response').innerText = 'User with ID ' + textFieldValue + ' has been deleted!';
                        }
                    })
                    .catch(error => {
                        document.getElementById('response').innerText = 'Error: ' + error;
                    });

            return false; // Prevent form submission
        }
    </script>
</head>

<body>
<h1>Usermanagement</h1>
<p>You may perform usermanagement here.</p>
<form onsubmit="return makeGetRequest();">
    <label for="inputField">Enter text:</label>
    <input type="text" id="inputField" name="inputField" required>
    <button type="submit">Submit</button>
</form>
<pre id="response"></pre>

</body>


</html>
