name: prometheus monitoring

services:
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - prometheus-network
  kurtama:
    build:
      ../..
    ports:
      - "8007:8007"
    networks:
      - prometheus-network

